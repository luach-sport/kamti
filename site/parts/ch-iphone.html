        <h2 id="iphone-h">ומה עם אייפון?</h2>
      </div>
      <p class="intro">קמתי היא לאנדרואיד בלבד. באייפון, אפל לא נותנת לאתר או לאפליקציה שהוסיפו למסך הבית לצלצל כשהם סגורים, להופיע מעל הנעילה או לנעול את הווליום. בלי זה אין שעון שאפשר לסמוך עליו, ולכן אין גרסה לאייפון.</p>
